name: Deploy Boş Dükkân panel to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Validate inline JavaScript syntax in both panels
        run: |
          for file in index.html bos-dukkan-analiz.html; do
            output="/tmp/$(basename "$file").js"
            awk '/<script>/{inside=1; next} /<\/script>/{inside=0} inside' "$file" > "$output"
            node --check "$output"
          done
      - name: Check topic-engine data and originality contract
        run: |
          node <<'NODE'
          const fs = require('fs');
          const required = [
            ['computed performance summary', 'creativeEvidenceForPrompt'],
            ['program-locked source anchor', 'SourceTraceGuard.chooseAnchor'],
            ['source-trace output validation', 'SourceTraceGuard.validate'],
            ['validator panel', 'ideaOutputForValidation'],
            ['locked source payload label', 'A3A. KOD TARAFINDAN FİKİR ÜRETİLMEDEN ÖNCE SABİTLENEN KAYNAK KAYDI'],
            ['explicit data-to-idea bridge', 'VERİDEN FİKRE GEÇİŞ:'],
            ['explicit weak-link classification', 'dolaylı/zayıf bağ'],
            ['fixed provenance format', '11D) KAYNAK İZİ SABİT ŞABLONU'],
            ['measured finding label', 'ÖLÇÜLMÜŞ BULGU:'],
            ['relationship strength label', 'BAĞIN GÜCÜ: dolaylı/zayıf bağ'],
            ['creative leap label', 'YARATICI SIÇRAMA:'],
            ['evidence limitation label', 'VERİNİN KANITLAMADIĞI:'],
            ['hypothesis status label', 'TEST DURUMU: test edilmemiş yaratıcı hipotez'],
            ['A2 summary label', 'A2. KOD TARAFINDAN HESAPLANAN PERFORMANS SİNYALLERİ'],
            ['full-row metric calculation', 'const creativeMetricRows=own.filter(v=>v&&v.analyticsAvailable);'],
            ['reach and metric separation', 'VERİDEN FİKRE GEÇİŞ'],
            ['clean-run context reset', 'HER ÇALIŞTIRMADA SIFIRLAMA'],
            ['title is not scene evidence', 'KONU İPUCU İLE SAHNE KANITINI AYIR'],
            ['evidence labels', 'KANIT ETİKETİ'],
            ['explicit idea provenance', 'FİKRİN KAYNAK İZİ ZORUNLU'],
            ['no fabricated data linkage', 'SAHTE VERİ BAĞI YASAK'],
            ['computed evidence map', 'A3. FİKİR SEÇİMİNDE KULLANILABİLECEK GERÇEK KANIT HARİTASI'],
            ['observed daily view pace', 'viewsPerObservedDay'],
            ['current trend sample state', 'currentState:']
          ];
          for (const file of ['index.html', 'bos-dukkan-analiz.html']) {
            const html = fs.readFileSync(file, 'utf8');
            for (const [label, phrase] of required) {
              if (!html.includes(phrase)) throw new Error(file + ': missing contract: ' + label);
            }
            if (!html.includes('Tam 10 saniye') && !html.includes('TEK ZORUNLU VİDEO KOŞULLARI')) {
              throw new Error(file + ': required 10-second video format contract missing');
            }
            console.log('PASS ' + file + ': ' + required.length + ' topic-engine contracts present');
          }
          NODE
      - name: Test source-trace validator
        run: |
          node --check source-trace-guard.js
          node --test tests/source-trace-guard.test.cjs
      - name: Prepare static panel
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp bos-dukkan-analiz.html _site/bos-dukkan-analiz.html
          cp source-trace-guard.js _site/source-trace-guard.js
          cp README.md _site/README.md
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publish site
        id: deployment
        uses: actions/deploy-pages@v4

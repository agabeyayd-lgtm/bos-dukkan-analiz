name: Deploy Boş Dükkân panel to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Validate inline JavaScript syntax
        run: |
          awk '/<script>/{inside=1; next} /<\/script>/{inside=0} inside' index.html > /tmp/panel-inline.js
          node --check /tmp/panel-inline.js
      - name: Prepare static panel
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp bos-dukkan-analiz.html _site/bos-dukkan-analiz.html
          cp README.md _site/README.md
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publish site
        id: deployment
        uses: actions/deploy-pages@v4

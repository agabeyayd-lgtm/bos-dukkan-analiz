name: Validate Boş Dükkân panel

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate inline JavaScript syntax in both panels
        run: |
          for file in index.html bos-dukkan-analiz.html; do
            output="/tmp/$(basename "$file").js"
            awk '/<script>/{inside=1; next} /<\/script>/{inside=0} inside' "$file" > "$output"
            node --check "$output"
          done

      - name: Check global-source workflow contract
        run: |
          node <<'NODE'
          const fs = require('fs');
          const required = [
            ['global source anchor', 'SourceTraceGuard.chooseGlobalAnchor'],
            ['global source selection is locked', 'SABİTLENMİŞ GLOBAL KAYNAK (değiştirme)'],
            ['global-only idea prompt button', 'createGlobalIdeaPrompt'],
            ['standalone global prompt builder', 'function buildGlobalIdeaPrompt'],
            ['automatic storyboard fetcher', 'async function fetchPublicStoryboard'],
            ['tries several global sources for storyboard', 'findGlobalStoryboardSource'],
            ['storyboard preview output', 'globalStoryboardPreview'],
            ['storyboard failure never blocks idea production', 'Görsel kaynağa erişilememesi fikir üretimini durduramaz'],
            ['post-publication report is clearly separate', 'Yayın sonrası ölçüm raporu — fikir üretmez'],
            ['no channel OAuth in the global idea flow', 'Global konu paketini oluştur ve kopyala'],
            ['global source trace validator', 'SourceTraceGuard.validate'],
            ['global validator input', 'globalIdeaOutputForValidation'],
            ['global video URL in prompt', 'https://www.youtube.com/watch?v='],
            ['external web cross-check label', 'GLOBAL WEB KONTROLÜ'],
            ['visual scene limitation label', 'GÖRSEL SAHNE DURUMU'],
            ['source principle label', 'KAYNAKTAN ALINAN İLKE'],
            ['original creative leap label', 'ÖZGÜN YARATICI SIÇRAMA'],
            ['not copied label', 'KOPYALANMAYAN UNSURLAR'],
            ['evidence boundary label', 'KANIT SINIRI'],
            ['unverified hypothesis label', 'test edilmemiş yaratıcı hipotez'],
            ['video playback not required', 'Video izleme/ekran kaydı fikir üretmek için zorunlu değildir'],
            ['own-channel metrics are post-publication only', 'Kendi kanal verisi yalnızca yayın sonrası karşılaştırma içindir']
          ];
          for (const file of ['index.html', 'bos-dukkan-analiz.html']) {
            const html = fs.readFileSync(file, 'utf8');
            for (const [label, phrase] of required) {
              if (!html.includes(phrase)) throw new Error(file + ': missing contract: ' + label);
            }
            if (!html.includes('Tam 10 saniye') && !html.includes('TEK ZORUNLU VİDEO KOŞULLARI')) {
              throw new Error(file + ': required 10-second video format contract missing');
            }
            for (const stale of ['ownDataForPrompt', 'creativeEvidenceForPrompt', 'ideaEvidenceTrace', 'validateIdeaTrace']) {
              if (html.includes(stale)) throw new Error(file + ': legacy mixed channel-data idea path remains: ' + stale);
            }
            if (html.includes('SourceTraceGuard.chooseAnchor(')) {
              throw new Error(file + ': stale own-channel source anchor still wired into idea engine');
            }
            console.log('PASS ' + file + ': ' + required.length + ' global-source contracts present');
          }
          NODE

      - name: Test global source-trace validator
        run: |
          node --check source-trace-guard.js
          node --test tests/source-trace-guard.test.cjs

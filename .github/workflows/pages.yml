name: Validate Boş Dükkân panel

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate inline JavaScript syntax in both panels
        run: |
          for file in index.html bos-dukkan-analiz.html; do
            output="/tmp/$(basename "$file").js"
            awk '/<script>/{inside=1; next} /<\/script>/{inside=0} inside' "$file" > "$output"
            node --check "$output"
          done

      - name: Validate comedy learning module
        run: |
          node --check comedy-learning.js
          node --check independent-scenario-engine.js
          node <<'NODE'
          const fs = require('fs');
          const js = fs.readFileSync('comedy-learning.js', 'utf8');
          const required = [
            'MASTER_PAGES',
            'PSYCH_PAGES',
            'FALLBACK_FINDINGS',
            'HISTORY_KEY',
            'async function loadKnowledge()',
            'function readHistory()',
            'function writeHistory(list)',
            'function readNotes()',
            'const originalGlobalIdeaPromptBuilder = window.buildGlobalIdeaPrompt;',
            'originalGlobalIdeaPromptBuilder.apply(this, arguments)',
            'await getResearchBundle();',
            'OWN_ANALYTICS_KEY',
            'function saveOwnAnalyticsSnapshot(snapshot)',
            'function buildOwnAnalyticsLearning()',
            'KENDİ KANAL ANALYTICS ÖĞRENME BAĞLAMI',
            'ÖNCEKİ FİKİR NOTLARI',
            'originalGlobalIdeaClickHandler.call(this, event)',
            'KOMEDİ ÖĞRENME VE TEKRAR KONTROLÜ',
            'window.BosDukkanComedyLearning'
          ];
          for (const phrase of required) {
            if (!js.includes(phrase)) throw new Error('Missing dynamic comedy learning contract: ' + phrase);
          }
          for (const file of ['index.html', 'bos-dukkan-analiz.html']) {
            const html = fs.readFileSync(file, 'utf8');
            for (const phrase of ['data-p="learn"', 'data-p="gen"', 'data-p="own"', 'comedy-learning.js', 'id="comedyResearchNotes"', 'id="ownAnalyticsLearningStatus"', 'id="clearOwnAnalyticsLearning"']) {
              if (!html.includes(phrase)) throw new Error(file + ': missing three-part panel contract: ' + phrase);
            }
            console.log('PASS ' + file + ': dynamic learning and native global-research contracts present');
          }
          console.log('PASS dynamic comedy learning overlay and three-part panel contracts');
          NODE

      - name: Verify comedy learning protocol is persisted and connected
        run: |
          node <<'NODE'
          const fs = require('fs');
          const knowledge = JSON.parse(fs.readFileSync('knowledge.json', 'utf8'));
          if (!Array.isArray(knowledge.learningProtocol) || knowledge.learningProtocol.length < 8) {
            throw new Error('knowledge.json must include the persistent learningProtocol');
          }
          if (!Array.isArray(knowledge.artistResearchCandidates) || knowledge.artistResearchCandidates.length < 7) {
            throw new Error('knowledge.json must retain artist research candidates with evidence status');
          }
          const scenario = fs.readFileSync('independent-scenario-engine.js', 'utf8');
          const learning = fs.readFileSync('comedy-learning.js', 'utf8');
          const spec = fs.readFileSync('TOPIC_ENGINE_SPEC.md', 'utf8');
          const scenarioContracts = [
            'KANIT ETİKETLERİ',
            'USTA BAŞINA KAYIT',
            'PSİKOLOJİYİ ÇOKLU MERCEKLE KULLAN',
            'ÖĞRENME → ÖZGÜN NEDENSEL MEKANİZMA',
            'KALICI MOTOR ÖĞRENME PROTOKOLÜ',
            'KANIT STANDARDI'
          ];
          for (const phrase of scenarioContracts) {
            if (!scenario.includes(phrase) && !learning.includes(phrase)) {
              throw new Error('Missing scenario/research/judge protocol contract: ' + phrase);
            }
          }
          for (const phrase of ['MOTOR ÖĞRENME PROTOKOLÜ', 'YENİ USTA ARAŞTIRMA ADAYLARI', 'learningProtocol']) {
            if (!learning.includes(phrase)) throw new Error('Missing trend prompt binding: ' + phrase);
          }
          if (!spec.includes('Kalıcı motor öğrenme protokolü — çalışan sözleşme')) {
            throw new Error('TOPIC_ENGINE_SPEC.md must document the connected protocol');
          }
          console.log('PASS persistent comedy learning protocol: knowledge → research → scenario → trend → judge');
          NODE

      - name: Check global-source workflow contract
        run: |
          node <<'NODE'
          const fs = require('fs');
          const required = [
            ['global source anchor', 'SourceTraceGuard.chooseGlobalAnchor'],
            ['global source selection is locked', 'SABİTLENMİŞ GLOBAL KAYNAK (değiştirme)'],
            ['global-only idea prompt button', 'createGlobalIdeaPrompt'],
            ['standalone global prompt builder', 'function buildGlobalIdeaPrompt'],
            ['automatic storyboard fetcher', 'async function fetchPublicStoryboard'],
            ['tries several global sources for storyboard', 'findGlobalStoryboardSource'],
            ['storyboard preview output', 'globalStoryboardPreview'],
            ['storyboard failure never blocks idea production', 'Görsel kaynağa erişilememesi fikir üretimini durduramaz'],
            ['post-publication report is clearly separate', 'Yayın sonrası ölçüm raporu — fikir üretmez'],
            ['no channel OAuth in the global idea flow', 'Global konu paketini oluştur ve kopyala'],
            ['global source trace validator', 'SourceTraceGuard.validate'],
            ['global validator input', 'globalIdeaOutputForValidation'],
            ['global video URL in prompt', 'https://www.youtube.com/watch?v='],
            ['external web cross-check label', 'GLOBAL WEB KONTROLÜ'],
            ['visual scene limitation label', 'GÖRSEL SAHNE DURUMU'],
            ['source principle label', 'KAYNAKTAN ALINAN İLKE'],
            ['original creative leap label', 'ÖZGÜN YARATICI SIÇRAMA'],
            ['not copied label', 'KOPYALANMAYAN UNSURLAR'],
            ['evidence boundary label', 'KANIT SINIRI'],
            ['unverified hypothesis label', 'test edilmemiş yaratıcı hipotez'],
            ['video playback not required', 'Video izleme/ekran kaydı fikir üretmek için zorunlu değildir'],
            ['global-source and analytics roles stay separate', 'Kendi kanal ölçümleri global kaynak yerine geçmez; yalnızca gerçek performans bağlamı'],
            ['three-part panel includes comedy learning', 'data-p="learn"'],
            ['global topic engine is separate', 'data-p="gen"'],
            ['post-publication analytics is the third tab', '3. Yayın sonrası ölçüm'],
            ['learning module is loaded', 'comedy-learning.js']
          ];
          for (const file of ['index.html', 'bos-dukkan-analiz.html']) {
            const html = fs.readFileSync(file, 'utf8');
            for (const [label, phrase] of required) {
              if (!html.includes(phrase)) throw new Error(file + ': missing contract: ' + label);
            }
            if (!html.includes('Tam 10 saniye') && !html.includes('TEK ZORUNLU VİDEO KOŞULLARI')) {
              throw new Error(file + ': required 10-second video format contract missing');
            }
            for (const stale of ['ownDataForPrompt', 'creativeEvidenceForPrompt', 'ideaEvidenceTrace', 'validateIdeaTrace']) {
              if (html.includes(stale)) throw new Error(file + ': legacy mixed channel-data idea path remains: ' + stale);
            }
            if (html.includes('SourceTraceGuard.chooseAnchor(')) {
              throw new Error(file + ': stale own-channel source anchor still wired into idea engine');
            }
            console.log('PASS ' + file + ': ' + required.length + ' global-source contracts present');
          }
          NODE

      - name: Test global source-trace validator
        run: |
          node --check source-trace-guard.js
          node --test tests/source-trace-guard.test.cjs

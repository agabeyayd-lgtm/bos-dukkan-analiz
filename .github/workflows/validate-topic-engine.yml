name: Validate topic engine

on:
  push:
    branches:
      - main
      - feat/data-driven-topic-engine
    paths:
      - index.html
      - bos-dukkan-analiz.html
      - source-trace-guard.js
      - tests/source-trace-guard.test.cjs
      - .github/workflows/validate-topic-engine.yml
      - .github/workflows/pages.yml
  pull_request:
    branches:
      - main
    paths:
      - index.html
      - bos-dukkan-analiz.html
      - source-trace-guard.js
      - tests/source-trace-guard.test.cjs
      - .github/workflows/validate-topic-engine.yml
      - .github/workflows/pages.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Extract inline JavaScript and check syntax in both panels
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class InlineScripts(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.inline = False
                  self.current = []
                  self.scripts = []

              def handle_starttag(self, tag, attrs):
                  if tag.lower() == "script":
                      attrs = dict(attrs)
                      self.inline = "src" not in attrs
                      self.current = []

              def handle_endtag(self, tag):
                  if tag.lower() == "script":
                      if self.inline:
                          self.scripts.append("".join(self.current))
                      self.inline = False
                      self.current = []

              def handle_data(self, data):
                  if self.inline:
                      self.current.append(data)

          for filename in ("index.html", "bos-dukkan-analiz.html"):
              source = Path(filename).read_text(encoding="utf-8")
              parser = InlineScripts()
              parser.feed(source)
              if not parser.scripts:
                  raise SystemExit(f"No inline JavaScript was found in {filename}.")
              output = Path("/tmp") / (filename.replace(".html", "") + ".js")
              output.write_text("\n;\n".join(parser.scripts), encoding="utf-8")
              assert "createGlobalIdeaPrompt" in source, f"{filename}: global-only idea workflow is missing"
              assert "function buildGlobalIdeaPrompt" in source, f"{filename}: global prompt builder is missing"
              assert "SourceTraceGuard.chooseGlobalAnchor" in source, f"{filename}: global source anchor is missing"
              assert "window.bosOwnAnalyticsSnapshot" in source, f"{filename}: own-channel metrics panel was unexpectedly removed"
              assert "KOPYALANMAYAN UNSURLAR" in source, f"{filename}: originality/source-difference rule is missing"
              assert "Video oynatma" in source, f"{filename}: no-playback verification alternative is missing"
              assert "Kendi kanal verisi yalnızca yayın sonrası karşılaştırma içindir" in source, f"{filename}: channel separation rule is missing"
              assert "Yayın sonrası ölçüm raporunu oluştur ve kopyala" in source, f"{filename}: separate analytics report action is missing"
              for stale in ("ownDataForPrompt", "creativeEvidenceForPrompt", "ideaEvidenceTrace", "validateIdeaTrace"):
                  assert stale not in source, f"{filename}: legacy mixed channel-data path remains: {stale}"
          PY
          for file in /tmp/index.js /tmp/bos-dukkan-analiz.js; do node --check "$file"; done
          node --check source-trace-guard.js
          node --test tests/source-trace-guard.test.cjs

name: Free Shorts frame access diagnostic

on:
  workflow_dispatch:
  push:
    branches: [test/free-shorts-frames]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install free extractor
        run: python -m pip install --disable-pip-version-check yt-dlp
      - name: Test public Shorts metadata and storyboard fields
        run: python scripts/test_shorts_frames.py
      - name: Save diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shorts-frame-diagnostic
          path: shorts-frame-test/
          if-no-files-found: warn
          retention-days: 7
